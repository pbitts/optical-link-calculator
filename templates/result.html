<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optical Link Simulation Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 2rem;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <h1 class="mb-4">Optical Link Simulation Results</h1>

        {{ table | safe }}
    </div>

    <a href="/" class="btn btn-primary mt-4">Run New Simulation</a>
</body>
</html>
